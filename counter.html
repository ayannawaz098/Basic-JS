  <h1>Hello web</h1>
  <button id="b1" style="text-align: center;">INCREASE</button>
  <button id="b2" style="text-align: center;">DECREASE</button>
  <button id="b3" style="text-align: center;">Reset</button>
<h2 id="num">0</h2>
  <script>
    let count=0;
    let up=document.getElementById('b1');
    let down=document.getElementById('b2');
    let check=document.getElementById('num');
    let res=document.getElementById('b3');
    up.addEventListener("click" ,function(){
        count=count+1;
        check.innerHTML=count;

    })
    down.addEventListener("mouseover", function(){
        count=count-1;
        check.innerHTML=count
    })
    res.addEventListener("click", function(){
        count=0;
        check.innerHTML=count;

    })


  </script>
  </body>
</html>
